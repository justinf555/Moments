name: CI

on:
  pull_request:
  push:
    branches: [main]

# Superseded PR runs are cancelled by the next push; every other run (push to
# main, schedule) gets a group of its own so main commits never queue behind
# or get dropped in favour of each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  pull-requests: write

jobs:
  typos:
    name: Typo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6

  ai-attribution:
    name: AI attribution
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check commit trailers and PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Dependabot can't fill in the PR template, so its PRs skip the
          # description check. Commits are still checked, including any a
          # maintainer pushes onto the PR.
          if [[ "$PR_AUTHOR" == "dependabot[bot]" ]]; then
            scripts/check-ai-attribution.sh "$BASE_SHA..$HEAD_SHA"
          else
            printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
            scripts/check-ai-attribution.sh "$BASE_SHA..$HEAD_SHA" "$RUNNER_TEMP/pr-body.md"
          fi

  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    steps:
      - uses: actions/checkout@v7

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: build-aux/io.github.justinf555.Moments.ci.json
          run-tests: true
          bundle: moments-devel.flatpak
          cache-key: flatpak-builder-${{ hashFiles('build-aux/io.github.justinf555.Moments.ci.json', 'Cargo.lock') }}

  summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [typos, reuse, ai-attribution, build-and-test]
    if: github.event_name == 'pull_request' && always()

    steps:
      - name: Post PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ci-summary
          message: |
            ## CI Summary

            | Check | Status |
            |-------|--------|
            | Typo check | ${{ needs.typos.result == 'success' && '✅ Pass' || '❌ Fail' }} |
            | REUSE compliance | ${{ needs.reuse.result == 'success' && '✅ Pass' || '❌ Fail' }} |
            | AI attribution | ${{ needs.ai-attribution.result == 'success' && '✅ Pass' || '❌ Fail' }} |
            | Build & test (fmt + clippy + unit + integration) | ${{ needs.build-and-test.result == 'success' && '✅ Pass' || '❌ Fail' }} |

            <sub>[full run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})</sub>
