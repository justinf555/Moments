name: Flatpak bundle

# Builds the redistributable single-file Flatpak bundle (`make bundle`) and
# uploads it as a workflow artifact.
#
# Called by release.yml to produce the artifacts attached to a GitHub Release,
# and runnable on its own from the Actions tab to smoke-test a bundle build
# without cutting a release.

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build. Defaults to the triggering ref.
        type: string
        required: false
        default: ''
      channel:
        description: 'release (production app id) or nightly (.Nightly app id).'
        type: string
        required: false
        default: release
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag or SHA). Blank = this branch.
        type: string
        required: false
        default: ''
      channel:
        description: Which channel to bundle.
        type: choice
        required: false
        default: release
        options: [release, nightly]

jobs:
  bundle:
    name: Build bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    # Secrets aren't available in step `if:` conditions, so surface them as
    # job-level env vars the conditions can test.
    env:
      GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
      GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # `make bundle CHANNEL=nightly` derives its version suffix from
          # `git describe`, which needs tags and full history.
          fetch-depth: 0
          fetch-tags: true

      # The flathub image is Fedora-based and does the real build inside the
      # flatpak sandbox, so host `make` isn't guaranteed to be present.
      - name: Ensure make is available
        run: command -v make >/dev/null || dnf install -y make

      # Split restore/save rather than actions/cache@v4, so the save can be
      # gated. A manual workflow_dispatch can point `ref` at an arbitrary
      # commit; writing that build's output to the shared cache would let it
      # poison what the release build later restores. Dispatch builds read the
      # cache, they don't write it.
      - name: Restore flatpak-builder state
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .flatpak-builder
          key: flatpak-bundle-${{ inputs.channel }}-${{ hashFiles('build-aux/io.github.justinf555.Moments.*.json', 'Cargo.lock') }}
          restore-keys: flatpak-bundle-${{ inputs.channel }}-

      # Signing is optional: with no FLATPAK_GPG_PRIVATE_KEY secret the bundle
      # is still built and published, just unsigned. To enable it, generate a
      # passphrase-less key (ostree signs non-interactively, so a passphrase
      # would stall the build):
      #
      #   gpg --quick-generate-key "Moments Releases <you@example.com>" \
      #       default default never
      #   gpg --armor --export-secret-keys <fingerprint>
      #
      # Store that armoured private key as the FLATPAK_GPG_PRIVATE_KEY secret
      # and the fingerprint as FLATPAK_GPG_KEY_ID.
      - name: Import GPG signing key
        id: gpg
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          set -euo pipefail
          if [ -z "$GPG_KEY_ID" ]; then
            echo "FLATPAK_GPG_PRIVATE_KEY is set but FLATPAK_GPG_KEY_ID is not" >&2
            exit 1
          fi
          GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | GNUPGHOME="$GNUPGHOME" gpg --batch --import
          echo "homedir=$GNUPGHOME" >> "$GITHUB_OUTPUT"
          echo "key_id=$GPG_KEY_ID" >> "$GITHUB_OUTPUT"

      # --install-deps-from pulls the runtime, SDK and sdk-extensions the
      # manifest declares. Without it flatpak-builder can't read the SDK's
      # extension point (which pins org.freedesktop.Sdk.Extension to 25.08)
      # and falls back to the runtime's own branch, asking for a
      # rust-stable/x86_64/50 that doesn't exist:
      #
      #   error: Requested extension org.freedesktop.Sdk.Extension.rust-stable/x86_64/50 not installed
      #
      # ci.yml doesn't hit this because the flatpak-builder action installs
      # deps for you. Resolving it from the manifest rather than pinning
      # 25.08 here keeps it correct across future GNOME SDK bumps.
      - name: Build bundle
        run: |
          make bundle \
            CHANNEL='${{ inputs.channel }}' \
            GPG_KEY='${{ steps.gpg.outputs.key_id }}' \
            GPG_HOMEDIR='${{ steps.gpg.outputs.homedir }}' \
            FLATPAK_BUILDER_ARGS='--disable-rofiles-fuse --install-deps-from=flathub'

      - name: Save flatpak-builder state
        # Trusted callers only: release.yml (a tag from a merged release PR)
        # and nightly.yml (tip of main). Never a manual dispatch.
        if: >-
          github.event_name != 'workflow_dispatch'
          && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .flatpak-builder
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Export public signing key
        if: steps.gpg.outputs.key_id != ''
        env:
          GNUPGHOME: ${{ steps.gpg.outputs.homedir }}
        run: gpg --armor --export "${{ steps.gpg.outputs.key_id }}" > moments-releases.asc

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle-${{ inputs.channel }}
          path: |
            moments-*.flatpak
            moments-*.flatpak.sha256
            moments-releases.asc
          if-no-files-found: error
          retention-days: 14
