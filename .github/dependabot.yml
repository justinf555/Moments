#
# Dependency updates (#725). Two tiers, by how well CI covers a crate:
#
#   auto    patch/minor bumps of crates the unit and integration tests
#           exercise, and GitHub Actions bumps other than third-party
#           actions with a secret or write token (`manual-actions`). Auto-merged by
#           .github/workflows/dependabot-auto-merge.yml once Build & test
#           passes.
#   manual  everything else: the network stack (CI makes no real TLS or
#           Immich calls), media decoding (no fixture files), GTK/GNOME
#           bindings, sqlx minors, and any major bump. Opened as a PR and
#           checked locally in the dev container before merging.
#
# Groups match in order and a dependency joins the first one that fits, so
# `manual` (pattern "*") catches whatever the auto groups leave behind,
# including majors of auto-tier crates. Group names are what the auto-merge
# workflow keys on; rename them in both places.
#
# Security updates still open immediately. Advisories against auto-tier
# crates are batched into `security-auto` and auto-merged the same way;
# the rest open as individual PRs for review.
#
# Some patterns name transitive crates (syn, rustls-webpki, hyper, glib,
# ...). Version updates only touch direct dependencies, so those only match
# security updates.

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    groups:
      auto:
        update-types: [minor, patch]
        # Keep in sync with the "security-auto" group below (and the table in docs/dev-environment.md).
        patterns:
          - serde
          - serde_json
          - thiserror
          - tracing
          - tracing-subscriber
          - syn
          - quote
          - proc-macro2
          - tokio
          - tokio-util
          - futures-util
          - async-trait
          - uuid
          - chrono
          - toml
          - sha1
          - base64
          - lru
          - quick-xml
          - tempfile
      # sqlx minors can change query behaviour and migrations; patch only.
      auto-sqlx:
        update-types: [patch]
        patterns:
          - sqlx
      manual:
        patterns:
          - reqwest
          - rustls*
          - webpki*
          - hyper*
          - image
          - libheif-rs
          - rawler
          - kamadak-exif
          - gstreamer*
          - gtk4
          - libadwaita
          - glib*
          - gio*
          - libsecret
          - gettext-rs
          - dhat
          # Catch-all: sqlx minors, majors of anything, and new crates.
          - "*"
      security-auto:
        applies-to: security-updates
        update-types: [minor, patch]
        # Keep in sync with the "auto" group above (and the table in docs/dev-environment.md).
        patterns:
          - serde
          - serde_json
          - thiserror
          - tracing
          - tracing-subscriber
          - syn
          - quote
          - proc-macro2
          - tokio
          - tokio-util
          - futures-util
          - async-trait
          - uuid
          - chrono
          - toml
          - sha1
          - base64
          - lru
          - quick-xml
          - tempfile

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(ci)
    groups:
      # Rule: third-party actions that run with a secret or a write-scoped
      # token are merged by hand, since a compromised release could leak the
      # secret or push with the token. GitHub's own actions/* auto-merge via
      # the `actions` catch-all below. Listed first so these leave it.
      manual-actions:
        patterns:
          - anthropics/claude-code-action   # CLAUDE_CODE_OAUTH_TOKEN, id-token: write
          - dependabot/fetch-metadata       # contents + pull-requests: write (auto-merge job)
          - marocchino/sticky-pull-request-comment  # pull-requests: write
      actions:
        patterns:
          - "*"
